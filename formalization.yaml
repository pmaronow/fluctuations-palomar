fidelity:
  divergences: >-
    The upper-bound model uses a completed GOE Hamiltonian; its independent
    diagonal cancels from Gibbs probabilities and heat-bath rates. Fluctuation
    statements subtract n log 2 from the counting log partition function,
    preserving centered fluctuations and variance. The standard-deviation
    and variance bounds use separate eventual thresholds whose maximum gives
    the manuscript threshold. The barrier proof uses a weaker finite-chain
    local remainder sufficient for the stated endpoint, rather than the
    manuscript's sharper local expansion. See the manuscript's formal chapter.
review:
  status: agent-reviewed; build check, strict audit, and full protected three-kernel replay passed
  reviewers:
  - AI mathematical, statement-correspondence, and source-integration reviewers
  notes: >-
    Source developments record AI audits and independent kernel checks at
    their named revisions. Documentation checks verify the five-claim map,
    manuscript source inventory and supplied PDF identity, and official metadata
    loading. Historical manuscript build receipts concern their staged sources.
    Fresh protected kernel evidence is recorded in verification/README.md. No Palomar
    registration, acceptance, or independent human proof-review claim is made.
limitations:
- Corollaries 1.4 and 1.5 are not separately formalized or Comparator claims.
- The quantitative and almost-sure barrier forms, Metropolis and general bounded-rate dynamics, and relaxation-time bound are not formalized.
- The sharper local expansion is not a formal claim; the formal proof establishes a sufficient weaker remainder.
- Theorem 1.6 supplies fluctuation exponents, not a limiting law or positive variance prefactor. The Laplace-window input is proved internally.
- Corollary 1.7 retains arbitrary positive exponent slack; the bound without that slack is not formalized.
- The upper-bound saving is strictly below one quarter; neither endpoint attainment nor a global optimality theorem is asserted.
