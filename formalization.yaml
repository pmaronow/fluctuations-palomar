version: v0.4
project:
  name: Lower and Upper Bounds for Glauber Dynamics from Typical States of the Low-Temperature Sherrington–Kirkpatrick Model
  description: >-
    Lean formalization of five manuscript result groups: Theorems 1.1, 1.3, and
    1.6, and Corollaries 1.2 and 1.7. The barrier covers both clocks and every
    fixed threshold below one half, with exponent 7/30. The upper bound is the
    continuous-time statement for every fixed exponent saving between zero and
    one quarter. The fluctuation exponents and mean-bias lower bound have their
    stated positive exponent slack. The manuscript and exact scope are included.
  authors:
  - P. M. Aronow
  responsible_maintainers:
  - P. M. Aronow
  license: Apache-2.0
