status:
  scope: >-
    Five theorem exports, named LowerUpperBounds.theorem_1_1, corollary_1_2,
    theorem_1_3, theorem_1_6, and corollary_1_7. Solution connects them to proved
    endpoints; none has a literature or unproved analytic premise. Theorem 1.1
    has one coefficient for both clocks and all fixed thresholds below 1/2.
    Theorem 1.3 is continuous time only, at threshold 1/4, with 0 < c < 1/4.
    Theorem 1.6 proves exponents with arbitrary positive slack; Corollary 1.7
    proves the n^(-5/6-epsilon) bound. Challenge has five deliberate independent
    theorem placeholders; these are excluded from the proof-hole counts.
    The build check, strict Audit, and full protected three-kernel
    Comparator replay passed for the public content commit recorded in verification/.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
